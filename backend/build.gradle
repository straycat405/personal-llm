plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.14'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.bigteam'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springAiVersion', "1.1.6")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.ai:spring-ai-advisors-vector-store'
	implementation 'org.springframework.ai:spring-ai-starter-model-ollama'
	implementation 'org.springframework.ai:spring-ai-starter-model-anthropic'
	implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'
	implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	implementation 'org.springframework.ai:spring-ai-jsoup-document-reader'
	implementation 'org.springframework.ai:spring-ai-pdf-document-reader'
	implementation 'org.springframework.ai:spring-ai-tika-document-reader'
	implementation 'org.springframework.ai:spring-ai-advisors-vector-store'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'experiment'   // 로컬 실험용 — CI/일반 빌드에서 제외
	}
}

// 로컬 실행 전용: 실 Ollama + pgVector 필요 (docker compose up -d db, ollama serve)
tasks.register('ragAccuracyExperiment', Test) {
	environment 'SPRING_AI_ANTHROPIC_API_KEY', 'dummy'
	environment 'GOOGLE_AI_API_KEY', 'dummy'
	useJUnitPlatform {
		includeTags 'experiment'
	}
	filter {
		includeTestsMatching 'com.bigteam.btllm.rag.experiment.RagAccuracyExperiment'
	}
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	outputs.upToDateWhen { false }
}

// 로컬 실행 전용: 실제 Tool Calling을 포함한 PDF 답변 품질 평가
tasks.register('ragGenerationQualityExperiment', Test) {
	// 전체 애플리케이션 컨텍스트는 멀티 provider 빈을 생성한다. 평가에서는 Ollama만 호출하므로
	// 외부 통신 없는 더미 키로 빈 생성 조건만 충족해 로컬 재현성을 보장한다.
	environment 'SPRING_AI_ANTHROPIC_API_KEY', 'dummy'
	environment 'GOOGLE_AI_API_KEY', 'dummy'
	useJUnitPlatform {
		includeTags 'experiment'
	}
	filter {
		includeTestsMatching 'com.bigteam.btllm.rag.experiment.RagGenerationQualityExperiment'
	}
	testLogging {
		showStandardStreams = true
	}
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	outputs.upToDateWhen { false }
}
