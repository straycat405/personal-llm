plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.14'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.bigteam'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springAiVersion', "1.1.6")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.ai:spring-ai-advisors-vector-store'
	implementation 'org.springframework.ai:spring-ai-starter-model-ollama'
	implementation 'org.springframework.ai:spring-ai-starter-model-anthropic'
	implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'
	implementation 'org.springframework.ai:spring-ai-starter-model-openai'
	implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	implementation 'org.springframework.ai:spring-ai-jsoup-document-reader'
	implementation 'org.springframework.ai:spring-ai-pdf-document-reader'
	implementation 'org.springframework.ai:spring-ai-tika-document-reader'
	implementation 'org.springframework.ai:spring-ai-advisors-vector-store'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform {
		// 실제 Ollama·pgVector를 호출하는 장시간 실험은 CI/일반 빌드에서 제외
		// provider-comparison은 상용 API 과금까지 발생하므로 반드시 제외한다
		excludeTags 'experiment', 'conversation-experiment', 'provider-comparison', 'reindex'
	}
}

// 로컬 실행 전용: 실 Ollama + pgVector 필요 (docker compose up -d db, ollama serve)
tasks.register('ragAccuracyExperiment', Test) {
	environment 'SPRING_AI_ANTHROPIC_API_KEY', 'dummy'
	environment 'GOOGLE_AI_API_KEY', 'dummy'
	useJUnitPlatform {
		includeTags 'experiment'
	}
	filter {
		includeTestsMatching 'com.bigteam.btllm.rag.experiment.RagAccuracyExperiment'
	}
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	outputs.upToDateWhen { false }
}

// 로컬 실행 전용: 실제 Tool Calling을 포함한 PDF 답변 품질 평가
tasks.register('ragGenerationQualityExperiment', Test) {
	// 전체 애플리케이션 컨텍스트는 멀티 provider 빈을 생성한다. 평가에서는 Ollama만 호출하므로
	// 외부 통신 없는 더미 키로 빈 생성 조건만 충족해 로컬 재현성을 보장한다.
	environment 'SPRING_AI_ANTHROPIC_API_KEY', 'dummy'
	environment 'GOOGLE_AI_API_KEY', 'dummy'
	useJUnitPlatform {
		includeTags 'experiment'
	}
	filter {
		includeTestsMatching 'com.bigteam.btllm.rag.experiment.RagGenerationQualityExperiment'
	}
	testLogging {
		showStandardStreams = true
	}
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	outputs.upToDateWhen { false }
}

// 로컬 실행 전용: 모델·생성 파라미터별 대화 의도와 지시 준수 품질 평가
tasks.register('localConversationQualityExperiment', Test) {
	environment 'SPRING_AI_ANTHROPIC_API_KEY', 'dummy'
	environment 'GOOGLE_AI_API_KEY', 'dummy'
	useJUnitPlatform {
		includeTags 'conversation-experiment'
	}
	filter {
		includeTestsMatching 'com.bigteam.btllm.chat.experiment.LocalConversationQualityExperiment'
	}
	testLogging {
		showStandardStreams = true
	}
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	outputs.upToDateWhen { false }
}

// 로컬 실행 전용: 평가용 문서를 실제 ETL 경로로 재색인 (색인 로직 변경 후 재현용)
//   REINDEX_PDF_PATH 환경변수로 대상 PDF 경로를 지정한다.
tasks.register('reindexDocument', Test) {
	environment 'SPRING_AI_ANTHROPIC_API_KEY', 'dummy'
	environment 'GOOGLE_AI_API_KEY', 'dummy'
	useJUnitPlatform {
		includeTags 'reindex'
	}
	filter {
		includeTestsMatching 'com.bigteam.btllm.rag.experiment.ReindexDocumentTask'
	}
	testLogging {
		showStandardStreams = true
	}
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	outputs.upToDateWhen { false }
}

// 로컬 실행 전용: 요약 청크가 개요형 질의에서 실제로 검색되는지 검색 단계만 진단
tasks.register('trackAttributionDiagnostic', Test) {
	environment 'SPRING_AI_ANTHROPIC_API_KEY', 'dummy'
	environment 'GOOGLE_AI_API_KEY', 'dummy'
	useJUnitPlatform { includeTags 'reindex' }
	filter {
		includeTestsMatching 'com.bigteam.btllm.rag.experiment.TrackAttributionDiagnostic'
	}
	testLogging { showStandardStreams = true }
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	outputs.upToDateWhen { false }
}

tasks.register('summaryRetrievalDiagnostic', Test) {
	environment 'SPRING_AI_ANTHROPIC_API_KEY', 'dummy'
	environment 'GOOGLE_AI_API_KEY', 'dummy'
	useJUnitPlatform {
		includeTags 'reindex'
	}
	filter {
		includeTestsMatching 'com.bigteam.btllm.rag.experiment.SummaryChunkRetrievalDiagnostic'
	}
	testLogging {
		showStandardStreams = true
	}
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	outputs.upToDateWhen { false }
}

// 로컬 실행 전용: 동일 RAG 골든셋을 로컬 모델과 상용 API에 각각 실행해 비교
//
// [주의] 상용 provider 키가 backend/.env에 설정돼 있으면 실제 과금이 발생한다.
//   다른 실험 태스크와 달리 상용 키를 더미로 덮어쓰지 않는다 — 실제 호출이 실험의 목적이기 때문.
//   키가 없는 provider는 실험 코드가 자동으로 건너뛰고 보고서에 사유를 남긴다.
// 대상 변경: PROVIDER_COMPARISON_TARGETS='ollama=qwen3:8b,openai=gpt-4o'
tasks.register('providerComparisonExperiment', Test) {
	// [주의] 비교 대상이 아닌 provider는 더미 키로 빈 생성 조건만 충족시킨다.
	//   Google starter의 CachedContentService처럼 우리 ChatClientFactory의 try-catch 밖에서
	//   즉시 생성되는 빈이 있어, 키가 비어 있으면 컨텍스트 기동 자체가 실패하기 때문이다.
	//   더미 키는 외부 통신을 하지 않으므로 실험 결과에 영향을 주지 않는다.
	//   OpenAI 키만은 덮어쓰지 않는다 — 실제 호출이 이 실험의 목적이다.
	environment 'SPRING_AI_ANTHROPIC_API_KEY', 'dummy'
	environment 'GOOGLE_AI_API_KEY', 'dummy'
	useJUnitPlatform {
		includeTags 'provider-comparison'
	}
	filter {
		includeTestsMatching 'com.bigteam.btllm.rag.experiment.ProviderComparisonExperiment'
	}
	testLogging {
		showStandardStreams = true
	}
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	outputs.upToDateWhen { false }
}
